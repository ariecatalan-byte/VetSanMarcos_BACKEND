# ===== Vet San Marcos Backend - DSY1104 EP3 =====
spring.application.name=vetsanmarcos-backend
server.port=${PORT:8080}

# Lee variables desde un archivo ".env" local (ignorado por git). Es opcional.
spring.config.import=optional:file:.env[.properties],optional:classpath:default-env.properties

# --- Base de datos relacional (MySQL por defecto; credenciales por variables de entorno) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vetsanmarcos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT: SIN valor por defecto a propósito (si falta JWT_SECRET la app no arranca) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_MS:900000}
app.jwt.refresh-expiration-days=${JWT_REFRESH_DAYS:7}
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}

# --- CORS ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

# --- Datos de prueba ---
app.seed.enabled=${SEED_ENABLED:true}

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.com.vetsanmarcos=INFO
