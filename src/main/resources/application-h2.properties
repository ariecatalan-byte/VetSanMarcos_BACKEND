# Perfil "h2": base relacional H2 guardada en ./data (persiste al reiniciar la app).
# Úsalo cuando no tengas MySQL:   mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:file:./data/vetsanmarcos;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
