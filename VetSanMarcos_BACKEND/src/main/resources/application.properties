# ===== Vet San Marcos Backend - DSY1104 EP3 =====
spring.application.name=vetsanmarcos-backend
server.port=8080

# --- Base de datos (H2 en memoria para pruebas rápidas) ---
# Cambia a MySQL descomentando las líneas de MySQL y comentando H2
spring.datasource.url=jdbc:h2:mem:vetsanmarcos;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (descomentar y ajustar cuando uses MySQL real) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/vetsanmarcos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=tu_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=VetSanMarcosSecretKeyDSY1104EvaluacionParcial3Fullstack2026DebeSerLargaYSegura
app.jwt.expiration-ms=86400000

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.vetsanmarcos=DEBUG
